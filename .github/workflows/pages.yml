name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "lib/**"
      - "js/**"
      - "runtime/Gemfile"
      - "patches/**"
      - "script/**"
      - "test/**"
      - "e2e/**"
      - "package*.json"
      - "Rakefile"
      - "Gemfile"
      - "Gemfile.lock"
      - "runtime/Gemfile.lock"
      - "webvas.gemspec"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: "4.0"
          bundler: default
          bundler-cache: true
          working-directory: main
      - name: Verify Ruby package
        run: bundle exec rake verify
      - name: Install WebAssembly build dependencies
        run: BUNDLE_GEMFILE=runtime/Gemfile bundle install --full-index
      - name: Create WebAssembly output directory
        run: mkdir -p build
      - name: Build WebAssembly runtime
        run: >-
          BUNDLE_GEMFILE=runtime/Gemfile bundle exec rbwasm build
          --ruby-version 4.0 --target wasm32-unknown-wasip1
          --build-profile full --patch "$(pwd)/patches/psych-wasi.patch"
          -o build/webvas.wasm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: main/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser playground and runtime
        run: npm run test:browser
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: main/public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
