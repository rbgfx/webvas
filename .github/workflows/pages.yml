name: Publish playground

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'js/**'
      - 'lib/**'
      - 'runtime/**'
      - 'script/**'
      - 'site/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - 'webvas.gemspec'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rbgfx/webvas
          path: repos/webvas
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rbgfx/glaze
          path: repos/glaze
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rbgfx/gesso
          path: repos/gesso
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rbgfx/glyphic
          path: repos/glyphic
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rbgfx/larb
          path: repos/larb
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rbgfx/rbgl
          path: repos/rbgl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rbgfx/rlsl
          path: repos/rlsl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rbgfx/tessel
          path: repos/tessel
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: false
      - name: Build Larb extension
        run: gem install rake-compiler --no-document && rake compile
        working-directory: repos/larb
      - name: Install build dependencies
        working-directory: repos/webvas
        run: |
          bundle install
          BUNDLE_GEMFILE=runtime/Gemfile bundle install
      - name: Verify Ruby package
        working-directory: repos/webvas
        run: bundle exec rake verify
      - name: Build browser runtime
        working-directory: repos/webvas
        env:
          BUNDLE_GEMFILE: runtime/Gemfile
        run: |
          mkdir -p build
          bundle exec rbwasm build --ruby-version 4.0 --target wasm32-unknown-wasip1 --build-profile full --patch "$GITHUB_WORKSPACE/repos/webvas/patches/psych-wasi.patch" -o build/webvas.wasm
      - name: Assemble static site
        working-directory: repos/webvas
        run: ruby script/build_site
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: repos/webvas/package-lock.json
      - name: Install browser test dependencies
        working-directory: repos/webvas
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test playground in Chromium
        working-directory: repos/webvas
        run: npm run test:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repos/webvas/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
