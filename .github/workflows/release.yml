name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (vX.Y.Z)
        required: false
        type: string
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Checkout Larb
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rbgfx/larb
          ref: main
          path: larb
          persist-credentials: false
      - name: Checkout RBGL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rbgfx/rbgl
          ref: main
          path: rbgl
          persist-credentials: false
      - name: Checkout tessel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rbgfx/tessel
          ref: main
          path: tessel
          persist-credentials: false
      - name: Checkout rlsl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rbgfx/rlsl
          ref: main
          path: rlsl
          persist-credentials: false
      - name: Checkout Gesso
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rbgfx/gesso
          ref: main
          path: gesso
          persist-credentials: false
      - name: Checkout Glyphic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rbgfx/glyphic
          ref: main
          path: glyphic
          persist-credentials: false
      - name: Link local dependencies
        run: |
          ln -s "$GITHUB_WORKSPACE/larb" "$GITHUB_WORKSPACE/../larb"
          ln -s "$GITHUB_WORKSPACE/rbgl" "$GITHUB_WORKSPACE/../rbgl"
          ln -s "$GITHUB_WORKSPACE/tessel" "$GITHUB_WORKSPACE/../tessel"
          ln -s "$GITHUB_WORKSPACE/rlsl" "$GITHUB_WORKSPACE/../rlsl"
          ln -s "$GITHUB_WORKSPACE/gesso" "$GITHUB_WORKSPACE/../gesso"
          ln -s "$GITHUB_WORKSPACE/glyphic" "$GITHUB_WORKSPACE/../glyphic"
      - name: Set up Ruby
        uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: '4.0'
          bundler: default
      - name: Build Larb native extension
        run: bundle install && bundle exec rake compile
        working-directory: larb
      - run: bundle install
      - name: Verify tag and version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(ruby -e 'print Gem::Specification.load(Dir.glob("*.gemspec").fetch(0)).version')"
          test "$RELEASE_TAG" = "v$version"
      - name: Test and build
        run: |
          bundle exec rake
          gemspec="$(find . -maxdepth 1 -name '*.gemspec' -print -quit)"
          gem build --strict "$gemspec" --output "$RUNNER_TEMP/package.gem"
      - name: Install runtime dependencies
        run: BUNDLE_GEMFILE=runtime/Gemfile bundle install
      - name: Build WebAssembly runtime
        run: >-
          BUNDLE_GEMFILE=runtime/Gemfile bundle exec rbwasm build
          --ruby-version 4.0 --target wasm32-unknown-wasip1
          --build-profile full --patch "$(pwd)/patches/psych-wasi.patch"
          -o "$RUNNER_TEMP/webvas.wasm"
      - name: Publish through RubyGems trusted publishing
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [ "$RELEASE_TAG" = "v0.1.0" ]; then
            printf '%s\n' 'Initial release' > "$RUNNER_TEMP/release-notes.md"
          else
            awk -v version="$version" '
              $0 == "## " version || $0 == "## [" version "]" || index($0, "## " version " -") == 1 || index($0, "## [" version "] -") == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          fi
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/webvas.wasm" --clobber
